# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------
name: Paul O. Hayne
email: Paul.Hayne@Colorado.edu
description: > # this means to ignore newlines until "url:"
  A simple academic web site design. Based on [*folio](https://github.com/bogoli/-folio) design.
footer_text: >
  Powered by <a href="http://jekyllrb.com/" target="_blank">Jekyll</a> with <a href="https://github.com/alshedivat/al-folio">al-folio</a> theme.
  Hosted by <a href="https://pages.github.com/" target="_blank">GitHub Pages</a>.

url: "" # the base hostname & protocol for your site - keep empty for local development
baseurl: "" # the subpath of your site, e.g. /blog/ - keep empty for local development
last_updated: # leave blank if you don't want to display last updated

webrick:
  headers:
    Access-Control-Allow-Origin: "*"

# -----------------------------------------------------------------------------
# Social integration
# -----------------------------------------------------------------------------
github_username: phayne # put your github username
twitter_username: phayne # put your twitter username
linkedin_username: # put your linkedin username
scholar_authorid: kgXwvksAAAAJ # Google Scholar user ID (from scholar.google.com/citations?user=...)
contact_note: #

google_analytics: UA-XXXXXXXXX # out your google-analytics code

# -----------------------------------------------------------------------------
# Blog
# -----------------------------------------------------------------------------
blog_name: 'EPIC: Exploration of Planetary Ices and Climates'
blog_description: research activities, meetings, and announcements

# Pagination
paginate: 4
permalink: /blog/:year/:title/
paginate_path: /blog/page:num/

text:
  pagination:
    newer: 'Newer'
    older: 'Older'

# Comments
disqus_shortname: none # put your disqus shortname

# Optional features
show_social_icons:  true
enable_anchorjs:    false
enable_katex:       true

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------
collections:
  news:
    defaults:
      layout: post
    output: true
    permalink: /news/:path/
  projects:
    output: true
    permalink: /projects/:path/
  pages:
    output: true
    permalink: /:path/

news_limit: 6

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

# Build settings
markdown: kramdown
highlighter: pygments

# Includes
include: ['_pages']

# Plugins
plugins:
    - jekyll-paginate
    - jemoji

emoji:
  src: "https://github.com/images/icons/"

# -----------------------------------------------------------------------------
# Other settings
# -----------------------------------------------------------------------------
jquery_version: "1.12.4"
katex_version: "0.7.1"
anchorjs_version: "3.2.2"
